[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-launcher-icon-fix"
version = "0.3.0"
description = "Fix Hydra Launcher game icons and shortcuts on Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skypetroller" }]
keywords = ["hydra", "launcher", "linux", "icons", "desktop"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]

[project.scripts]
hydra-fix = "hydra_fix.cli:main"

[tool.setuptools]
packages = ["hydra_fix"]
